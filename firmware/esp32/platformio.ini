; TX16S Remote UI — міст ESP32
; Вибір плати і швидкості обґрунтовано в docs/adr/0003-bridge-board-and-baudrate.md
;
; Розробка — на DevKit v1 (два ядра, більше пам'яті, прощає помилки).
; C3 SuperMini — кандидат на постійну установку, після замірів етапу 2.5.

[platformio]
default_envs = devkit_v1

[env]
; Чистий ESP-IDF — ADR-0004. Arduino не використовуємо:
; esp_http_server уміє WebSocket сам, тому ESPAsyncWebServer/AsyncTCP
; (головне джерело падінь) не потрібні, а пам'ять на C3 рахується.
framework = espidf
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DREMOTE_UI_BAUDRATE=921600
    -DCORE_DEBUG_LEVEL=2

; ---------- ESP32 DevKit v1 (WROOM-32) — плата для розробки ----------
; UART0 зайнятий логами через штатний перетворювач, тому беремо UART1.
; Приймання закріпити за ядром 1, Wi-Fi лишити на ядрі 0 — це головна
; перевага цієї плати над C3.
[env:devkit_v1]
platform = espressif32
board = esp32doit-devkit-v1
build_flags =
    ${env.build_flags}
    -DPIN_UART_RX=16          ; ← до TX пульта (AUX1)
    -DPIN_UART_TX=17          ; ← до RX пульта (AUX1)
    -DUART_PORT_NUM=1
    -DRX_TASK_CORE=1

; ---------- ESP32-C3 SuperMini — кандидат для корпусу ----------
; Одне ядро: Wi-Fi і приймання змагаються, тому 921600 і не більше.
; НЕ займати GPIO8 (світлодіод) і GPIO9 (boot).
; Власний USB (USB Serial/JTAG) → логи по USB-C, UART вільний.
; У sdkconfig: CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
[env:c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DPIN_UART_RX=20
    -DPIN_UART_TX=21
    -DUART_PORT_NUM=1
    -DRX_TASK_CORE=0

; ---------- запас: 2 Мбод на DevKit ----------
; Пробувати ПІСЛЯ того, як усе працює на 921600.
; Увага: наявний CP2102 має стелю 1 Мбод, тобто стенд етапу 2.4
; на цій швидкості не перевіриш.
[env:devkit_v1_2m]
extends = env:devkit_v1
build_flags =
    ${env:devkit_v1.build_flags}
    -UREMOTE_UI_BAUDRATE
    -DREMOTE_UI_BAUDRATE=2000000
