<!DOCTYPE html>
<!--
  Клієнт TX16S Remote UI.

  Лежить у прошивці моста і віддається ним же: телефон під'єднаний до точки
  доступу пульта, інтернету там немає. Тому — жодного CDN і жодних зовнішніх
  шрифтів.

  ⚠️ Коментарі САМЕ ЦЬОГО файлу їдуть у флеш: index.html мініфікатор лише
  копіює (`minify.mjs`), на відміну від js і css. Пояснення тримати в README.

  ⚠️ Нуль жорстко зашитої специфіки пульта: роздільність, перелік клавіш і
  наявність сенсора приходять у HELLO. Кнопки панелей будує panels.js.
-->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<!-- Запуск без браузерної обгортки: `manifest` для Android, дві мітки нижче —
     для iPhone, де опису застосунку замало (задача 0023, критерій 1.4). -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TX16S Remote UI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  Сцена: панель — екран — панель, а смужка стану — третій учасник тієї самої
  сітки, а не окремий поверх над нею.

  ⚠️ Смужка згорнута за замовчуванням і в згорнутому стані не займає власного
  ряду (задача 0023, критерій 1.1): найдорожчий ресурс на телефоні — висота.
  В альбомній вона лежить унизу на всю ширину й згорнута зникає цілком; у
  книжковій стоїть посередині між панелями, нижча за них, і згорнута лишає
  тільки власну ручку (критерій 7.2). Різницю робить CSS, розмітка одна.

  Панелі порожні: кнопки в них кладе panels.js після HELLO.
-->
<div id="stage">
  <div id="pad-left" class="pad">
    <!-- ⚠️ В альбомній ручка згортання поділена: три чверті — сама панель,
         чверть — смужка стану; окрема кнопка під смужкою з'їдала б висоту
         (критерій 2.6), а так їх дві, по одній під кожним великим пальцем.
         У книжковій поділу немає, і смужка має власну ручку (7.2, 7.3). -->
    <div class="pad-rail">
      <button class="pad-toggle" id="pad-left-toggle" type="button"
              title="згорнути / розгорнути панель">◀</button>
      <button class="bar-toggle" id="bar-toggle-left" type="button"
              title="смужка стану">≡</button>
    </div>
    <div class="pad-body" id="pad-left-body"></div>
  </div>

  <!-- ⚠️ tabindex: екран має вміти брати фокус, інакше клавіатурі нема на
       чому працювати, а людині — нічого побачити (0022, критерій 5.4). -->
  <div id="screen-wrap" tabindex="0">
    <!-- Розмір полотна виставляється з HELLO, а не тут. -->
    <canvas id="screen" width="16" height="9"></canvas>
    <!-- Завіса: стан з'єднання, а при зайнятому пульті — черга й переймання
         керування (0024). Кнопки лежать тут-таки, бо це те саме місце, куди
         людина вже дивиться, коли картинки немає. -->
    <div id="veil">
      <div id="veil-box">
        <span id="veil-text">під'єднуюсь…</span>
        <div id="veil-buttons" hidden>
          <button id="btn-take" type="button">Перейняти керування</button>
          <button id="btn-take-no" type="button" hidden>Скасувати</button>
          <button id="btn-take-yes" type="button" hidden>Підключитись</button>
        </div>
      </div>
    </div>
  </div>

  <div id="pad-right" class="pad">
    <div class="pad-rail">
      <button class="pad-toggle" id="pad-right-toggle" type="button"
              title="згорнути / розгорнути панель">▶</button>
      <button class="bar-toggle" id="bar-toggle-right" type="button"
              title="смужка стану">≡</button>
    </div>
    <div class="pad-body" id="pad-right-body"></div>
  </div>

  <div id="bar" class="collapsed">
    <!-- ⚠️ Власна ручка смужки — тільки для книжкової орієнтації (критерій
         7.2, він же виправлення 2.6): заборона окремої кнопки стосується
         альбомної, де бракує висоти. Тут вона лежить **усередині** смужки й
         лишається видимою, коли та згорнута, — інакше розгортати було б
         нічим. -->
    <button class="bar-own-toggle" id="bar-toggle-mid" type="button"
            title="смужка стану">≡</button>
    <div id="bar-row">
      <span id="link" class="chip">—</span>
      <span id="fps" class="chip">—</span>
      <!-- Зайнятість головного потоку. ⚠️ Не прикраса: це єдине число, яким зі
           стенда видно різницю між «міст не встигає віддати» і «телефон не
           встигає забрати» — приймання й малювання тут в одному потоці. -->
      <span id="busy" class="chip">—</span>
      <!-- Чи слухає клавіатура. Без цього «клавіатура не працює» неможливо
           відрізнити від «фокус в іншому місці» — 0022, критерій 5.4. -->
      <span id="focus" class="chip">—</span>
      <span id="radio" class="chip">—</span>
      <!-- ⚠️ Вільна пам'ять моста (задача 0021). Смужка згортається, тому при
           падінні нижче межі app.js розгортає її сам: число, по яке треба
           лізти, знаходять тоді, коли вже пізно. -->
      <span id="heap" class="chip" hidden>—</span>
      <!-- Поточна швидкість каналу видно завжди, а не тільки в мить зміни. -->
      <label id="baud-wrap" hidden>
        <select id="baud" title="швидкість каналу пульт ↔ міст"></select>
      </label>
      <!-- ⚠️ Перемикач очікування — прилад, а не налаштування на щодень:
           розлам і ривки не можна порівняти по пам'яті, обидва режими треба
           побачити поспіль. Без кнопки кожне порівняння коштувало б
           перепрошивання моста. -->
      <button id="btn-wait" type="button" title="очікування цілого кадру">чек: —</button>
      <!-- ⚠️ Кнопки «на весь екран» немає в розмітці: її додає app.js і лише
           там, де браузер це вміє. На iPhone способу немає взагалі, і мертва
           кнопка була б гіршою за відсутню (критерій 1.5). -->
      <button id="btn-refresh" type="button">Оновити</button>
      <button id="btn-info" type="button">Стан ▾</button>
    </div>
    <div id="info" hidden></div>
  </div>
</div>

<!-- Протокол окремо від оформлення: proto.js прогоняється тестами під node
     (`node webui/proto_test.js`) тими самими еталонними векторами, що й
     реалізації на C++ і Python.

     wait.js — політика показу кадру, теж без DOM: `node webui/wait_test.js`
     перевіряє правила, `python3 tools/wait_crosscheck.py` — що вони збігаються
     з клієнтом ПК. ⚠️ Порядок обов'язковий: wait.js читає сталі з proto.js.

     panels.js — намір, розкладка панелей і розгін енкодера
     (`node webui/panels_test.js`). -->
<script src="proto.js"></script>
<script src="wait.js"></script>
<script src="panels.js"></script>
<script src="app.js"></script>
</body>
</html>
