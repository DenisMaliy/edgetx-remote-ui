# ⚠️ Скрипт встановлення esbuild навмисно заборонений.
#
# pnpm 10+ типово блокує postinstall-скрипти й лишає тут незакрите питання;
# незакрите питання означає, що збірка поводиться по-різному на різних
# машинах. Відповідь — **false**, і вона перевірена: двійник esbuild приходить
# готовим у платформному пакеті (`@esbuild/linux-x64`), а postinstall лише
# знайшов би його вдруге. Мініфікація без нього працює.
allowBuilds:
  esbuild: false
